<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Respuesta al formulario</title>
<style>
    body {
        background-color: #eef4fc;
        color: #222222;
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    #datos {
        margin-top: 16px;
        font-size: 1.1em;
    }
</style>
</head>
<body>

<h1>Respuesta al formulario</h1>
<div id="datos"></div>

<script type="text/javascript">
    const parametros = new URLSearchParams(window.location.search);
    const nombre = parametros.get('nombre') || '(sin datos)';
    const apellido = parametros.get('apellido') || '(sin datos)';
    document.getElementById('datos').innerHTML =
        '<p>Nombre recibido: ' + nombre + '</p><p>Apellido recibido: ' + apellido + '</p>';
</script>

</body>
</html>
