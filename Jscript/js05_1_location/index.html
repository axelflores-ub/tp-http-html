<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>js05_1_location</title>
<style>
    body {
        background-color: #eef4fc;
        color: #222222;
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    p {
        max-width: 500px;
    }
    button {
        padding: 10px 18px;
        margin-right: 10px;
        border: 1px solid #1d3557;
        background-color: #cfe0fc;
        color: #1d3557;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
    }
    button:hover {
        background-color: #1d3557;
        color: #ffffff;
    }
</style>
</head>
<body>

<h1>Objeto location</h1>
<p>Cada botón redirige (con <code>location.href</code>) a una fuente distinta para seguir aprendiendo JavaScript:</p>

<button onclick="location.href='https://developer.mozilla.org/es/docs/Web/JavaScript'">MDN JavaScript</button>
<button onclick="location.href='https://javascript.info/'">javascript.info</button>
<button onclick="location.href='https://262.ecma-international.org/'">Especificación ECMAScript</button>

</body>
</html>
