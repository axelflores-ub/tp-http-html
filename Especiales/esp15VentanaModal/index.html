<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario en ventana modal</title>

<script>
    /* Se ejecuta apenas el navegador lee el head, antes de dibujar la página */
    alert("Ancho de ventana: " + window.innerWidth + " px");
</script>

<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        font-family: 'Trebuchet MS', Arial, sans-serif;
        background-color: #eef7f1;
        color: #2b2b2b;
    }

    /* ---------- Contenedor principal (el que se activa / desactiva) ---------- */
    #contenedor {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.25s ease;
    }

    .contenedorActivo {
        opacity: 1;
        pointer-events: auto;      /* todos los controles sensibles a eventos */
    }

    .contenedorPasivo {
        opacity: 0.3;              /* transparencia */
        pointer-events: none;      /* desactiva todos los controles */
    }

    .tarjeta {
        background-color: #ffffff;
        border-radius: 16px;
        box-shadow: 0 6px 24px rgba(61, 43, 107, 0.15);
        padding: 40px 48px;
        text-align: center;
        max-width: 420px;
        margin: 20px;
    }

    .tarjeta h1 {
        margin: 0 0 4px;
        font-size: 2rem;
        color: #3d2b6b;
    }

    .tarjeta .subtitulo {
        margin: 0 0 24px;
        color: #6b6485;
    }

    .contador {
        display: inline-block;
        background-color: #e3dcf5;
        color: #3d2b6b;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.95rem;
        margin-bottom: 24px;
    }

    .tarjeta button {
        display: block;
        width: 100%;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: bold;
        background-color: #cfe8d8;
        color: #1f5a3a;
        border: 1px solid #3c8c63;
        border-radius: 8px;
        cursor: pointer;
    }

    .tarjeta button:hover:not(:disabled) {
        background-color: #3c8c63;
        color: #ffffff;
    }

    .tarjeta button:disabled {
        background-color: #e4e4e4;
        color: #9a9a9a;
        border-color: #c4c4c4;
        cursor: not-allowed;
    }

    /* ---------- Ventana modal (prendida / apagada) ---------- */
    #ventanaModal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        z-index: 10;
    }

    /* Apagado: se desvanece y recién al terminar queda "hidden" */
    .ventanaModalApagado {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.25s ease, visibility 0s linear 0.25s;
    }

    /* Prendido: "visible" al instante (así se le puede dar foco) y aparece con fundido */
    .ventanaModalPrendido {
        visibility: visible;
        opacity: 1;
        transition: opacity 0.25s ease, visibility 0s;
    }

    .modalCaja {
        width: min(900px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.3);
        overflow: hidden;
    }

    .modalCabecera, .modalPie {
        flex: 0 0 auto;
        background-color: #e3dcf5;
        color: #3d2b6b;
    }

    .modalCabecera {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px 12px 24px;
    }

    .modalCabecera h2 {
        margin: 0;
        font-size: 1.25rem;
    }

    #btCierraModal {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #b3261e;
        background-color: #ffffff;
        border: 1px solid #b3261e;
        border-radius: 8px;
        cursor: pointer;
    }

    #btCierraModal:hover {
        background-color: #b3261e;
        color: #ffffff;
    }

    .modalPie {
        text-align: center;
        font-weight: bold;
        padding: 10px;
    }

    .modalCuerpo {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px 40px;
        padding: 26px 32px;
        background-color: #eef7f1;
    }

    .campo {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    .campo label {
        font-weight: bold;
        margin-bottom: 6px;
    }

    .campo input, .campo select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        font-size: 1rem;
        border: 1px solid #8a7bb8;
        border-radius: 8px;
        background-color: #ffffff;
    }

    .campo input:focus, .campo select:focus {
        outline: 3px solid #cdbff0;
        border-color: #6a4c93;
    }

    .campo button {
        width: 100%;
        padding: 14px;
        font-size: 1.05rem;
        font-weight: bold;
        background-color: #cfe8d8;
        color: #1f5a3a;
        border: 1px solid #3c8c63;
        border-radius: 8px;
        cursor: pointer;
    }

    .campo button:hover {
        background-color: #3c8c63;
        color: #ffffff;
    }

    @media (max-width: 700px) {
        .modalCuerpo {
            grid-template-columns: 1fr;
            padding: 20px 20px;
        }
        .tarjeta {
            padding: 28px 24px;
        }
    }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../generos.js"></script>
<script src="modal.js"></script>
</head>
<body>

<!-- Contenedor principal: se desactiva mientras el modal está abierto -->
<div id="contenedor" class="contenedorActivo">
    <div class="tarjeta">
        <h1>Biblioteca</h1>
        <p class="subtitulo">Maestro de libros</p>
        <div class="contador">Libros cargados: <strong id="cantLibros">0</strong></div>
        <button type="button" id="btAbreModal">Cargar un libro</button>
    </div>
</div>

<!-- Ventana modal: arranca apagada -->
<div id="ventanaModal" class="ventanaModalApagado" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
    <div class="modalCaja">

        <header class="modalCabecera">
            <h2 id="tituloModal">Formulario para ALTA · Maestro de Libros</h2>
            <button type="button" id="btCierraModal" aria-label="Cerrar la ventana">X</button>
        </header>

        <form id="formLibro" class="modalCuerpo">
            <div class="campo">
                <label for="codLibro">Código de libro:</label>
                <input type="text" id="codLibro" name="codLibro" maxlength="12" placeholder="Ej: LIB-0001" required>
            </div>

            <div class="campo">
                <label for="selectGenero">Género:</label>
                <select id="selectGenero" name="genero" required>
                    <!-- Las opciones se crean desde JavaScript a partir del JSON de géneros -->
                </select>
            </div>

            <div class="campo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>

            <div class="campo">
                <label for="fechaAlta">Fecha de alta:</label>
                <input type="date" id="fechaAlta" name="fechaAlta" required>
            </div>

            <div class="campo">
                <label for="ejemplares">Ejemplares disponibles:</label>
                <input type="number" id="ejemplares" name="ejemplares" min="0" value="0" required>
            </div>

            <div class="campo">
                <button type="submit">ENVIAR</button>
            </div>
        </form>

        <footer class="modalPie">Pie del formulario</footer>

    </div>
</div>

</body>
</html>
