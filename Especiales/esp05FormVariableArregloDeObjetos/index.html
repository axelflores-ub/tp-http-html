<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario de alta de libros</title>
<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        font-family: 'Trebuchet MS', Arial, sans-serif;
        background-color: #eef7f1;
        color: #2b2b2b;
    }

    /* Contenedor general: ocupa el 100% del alto del viewport, así no hay scroll de página */
    #contenedor {
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header, footer {
        flex: 0 0 auto;
        text-align: center;
        background-color: #e3dcf5;
        color: #3d2b6b;
        padding: 14px 10px;
    }

    header h1 {
        margin: 0;
        font-size: 1.6rem;
        line-height: 1.3;
    }

    footer {
        font-size: 1.2rem;
        font-weight: bold;
    }

    /* Cuerpo del formulario: grilla de 2 columnas que reparte el alto disponible */
    .cuerpo {
        flex: 1;
        min-height: 0;          /* permite que el cuerpo scrollee solo cuando hace falta */
        overflow-y: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(3, 1fr);
        column-gap: 60px;
        padding: 10px 60px;
    }

    .campo {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .campo label {
        font-weight: bold;
        font-size: 1.15rem;
        margin-bottom: 8px;
    }

    .campo input,
    .campo select {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        font-size: 1.1rem;
        border: 1px solid #8a7bb8;
        border-radius: 8px;
        background-color: #ffffff;
    }

    .campo input:focus,
    .campo select:focus {
        outline: 3px solid #cdbff0;
        border-color: #6a4c93;
    }

    .campo button {
        width: 100%;
        padding: 16px;
        font-size: 1.2rem;
        font-weight: bold;
        background-color: #cfe8d8;
        color: #1f5a3a;
        border: 1px solid #3c8c63;
        border-radius: 8px;
        cursor: pointer;
    }

    .campo button:hover {
        background-color: #3c8c63;
        color: #ffffff;
    }

    /* Pantallas angostas: todo en una sola columna, y el cuerpo scrollea entre header y footer */
    @media (max-width: 900px) {
        .cuerpo {
            grid-template-columns: 1fr;
            grid-template-rows: none;
            grid-auto-rows: auto;
            row-gap: 22px;
            padding: 20px 24px;
        }
    }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../generos.js"></script>
<script src="formulario.js"></script>
</head>
<body>

<div id="contenedor">

    <header>
        <h1>Formulario para ALTA<br>Maestro de Libros</h1>
    </header>

    <form id="formLibro" class="cuerpo">
        <div class="campo">
            <label for="codLibro">Código de libro:</label>
            <input type="text" id="codLibro" name="codLibro" maxlength="12" placeholder="Ej: LIB-0001" required>
        </div>

        <div class="campo">
            <label for="selectGenero">Género:</label>
            <select id="selectGenero" name="genero" required>
                <!-- Las opciones se crean desde JavaScript a partir del JSON de géneros -->
            </select>
        </div>

        <div class="campo">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo" required>
        </div>

        <div class="campo">
            <label for="fechaAlta">Fecha de alta:</label>
            <input type="date" id="fechaAlta" name="fechaAlta" required>
        </div>

        <div class="campo">
            <label for="ejemplares">Ejemplares disponibles:</label>
            <input type="number" id="ejemplares" name="ejemplares" min="0" value="0" required>
        </div>

        <div class="campo">
            <button type="submit">ENVIAR</button>
        </div>
    </form>

    <footer>Pie del formulario</footer>

</div>

</body>
</html>
