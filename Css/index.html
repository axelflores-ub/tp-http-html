<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Css</title>
<style>
    :root { --acento: #1d3557; --acento-claro: #cfe0fc; }
    body { margin: 0; font-family: Arial, sans-serif; background-color: #ffffff; color: #222222; }
    header { background-color: var(--acento); color: #ffffff; padding: 40px; }
    header h1 { margin: 0 0 6px; font-size: 2.2em; }
    header p { margin: 2px 0; opacity: 0.9; }
    main { padding: 30px 40px; }
    .grid { display: flex; flex-wrap: wrap; gap: 14px; }
    .grid a {
        display: block;
        padding: 18px 24px;
        background-color: var(--acento-claro);
        color: var(--acento);
        text-decoration: none;
        font-weight: bold;
        font-size: 1.1em;
        border-radius: 10px;
        min-width: 160px;
        text-align: center;
        transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }
    .grid a:hover { background-color: var(--acento); color: #ffffff; transform: translateY(-3px); }
    .volver { margin-top: 30px; }
    .volver a { color: var(--acento); }
</style>
</head>
<body>

<header>
    <h1>Css</h1>
    <p>Programación en ambiente de redes</p>
    <p>Axel Flores</p>
</header>

<main>
    <div class="grid">
        <a href="cssParte1/index.html">cssParte1</a>
        <a href="cssParte2/index.html">cssParte2</a>
        <a href="otros/">otros</a>
    </div>
    <p class="volver"><a href="../index.html">Volver al índice principal</a></p>
</main>

</body>
</html>
