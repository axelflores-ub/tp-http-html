<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Menu</title>
<style>
    body {
        margin: 0;
        background-color: #ffffff;
        font-family: Arial, sans-serif;
    }

    /* Menú armado con <ul> anidados: la lista principal, y dentro de cada <li>
       que tiene submenú, otra <ul> con sus propios <li> */
    .menu, .menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .menu {
        display: flex;
        background-color: #234a8c;
    }

    .menu > li {
        position: relative;
    }

    .menu > li > a {
        display: block;
        padding: 14px 22px;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
    }

    .menu > li:hover > a {
        background-color: #16305c;
    }

    /* El submenú arranca oculto... */
    .menu .submenu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: #2f5aa8;
        min-width: 170px;
        z-index: 5;
    }

    /* ...y se muestra solo cuando el mouse está sobre el <li> padre (selector :hover) */
    .menu > li:hover > .submenu {
        display: block;
    }

    .submenu li a {
        display: block;
        padding: 10px 16px;
        color: #ffffff;
        text-decoration: none;
    }

    .submenu li a:hover {
        background-color: #1c3d75;
    }
</style>
</head>
